services:
  # default configuration for services in *this* file
  _defaults:
    # automatically injects dependencies in your services
    autowire: true
    # automatically registers your services as commands, event subscribers, etc.
    autoconfigure: true
    # this means you cannot fetch services directly from the container via $container->get()
    # if you need to do this, you can override this setting on individual services
    public: false

  FixtureBundle\Installer\Installer:
    public: true
    arguments:
      $bundle: '@=service("kernel").getBundle("FixtureBundle")'

  # Faker: required by Alice providers (Assets, General, DateTime, ObjectReference)
  Faker\Generator:
    factory: ['Faker\Factory', 'create']

  # AliceDataFixtures: provide LoaderInterface and PersisterInterface for FixtureLoader
  Nelmio\Alice\Loader\NativeLoader: ~

  Fidry\AliceDataFixtures\Loader\SimpleLoader:
    arguments:
      $filesLoader: '@Nelmio\Alice\Loader\NativeLoader'

  Fidry\AliceDataFixtures\LoaderInterface: '@Fidry\AliceDataFixtures\Loader\SimpleLoader'

  Fidry\AliceDataFixtures\Persistence\PersisterInterface: '@FixtureBundle\Alice\Persister\PimcorePersister'

  FixtureBundle\Command\:
    resource: '../../Command'
    tags: ['console.command']

  FixtureBundle\Service\:
    resource: '../../Service'

  FixtureBundle\Alice\:
    resource: '../../Alice'
    exclude: 'Persister/PimcorePersister.php'

  # Explicit definition after resource so it overrides; bool args cannot be autowired
  FixtureBundle\Alice\Persister\PimcorePersister:
    autowire: false
    arguments:
      $checkPathExists: true
      $omitValidation: false
